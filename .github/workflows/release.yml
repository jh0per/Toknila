name: Release

# Push a tag like v0.2.1 (or run by hand with that tag) to build every platform and publish a
# GitHub release: the CLI archives, the macOS app (`.dmg`) and the files the in-app updater reads
# (`.app.tar.gz`, `.sig`, `latest.json`). On main it only builds, so a release is never the first
# build. Pull requests do not run these heavy builds; `ci.yml` covers them.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE == 'true' && env.TAG || github.sha }}

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The tag must match the version in Cargo.toml; xtask dist names the archive from it.
      - name: Check version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          v=$(cargo pkgid -p toknila | sed 's/.*[@#]//')
          test "v$v" = "$TAG" || { echo "tag $TAG != version v$v"; exit 1; }

      - name: cargo xtask dist
        run: cargo xtask dist ${{ matrix.target }}

      # One signing identity for every Mac build, so macOS keeps the privacy permissions the
      # owner granted across updates. With the three secrets the certificate goes into a
      # temporary keychain and `cargo xtask app` signs with it (APPLE_SIGNING_IDENTITY); without
      # them the app is signed ad hoc and the step says so. See docs/install.md, "Signing the Mac app".
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY): the app will be signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/toknila-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_GIVEN=true" >> "$GITHUB_ENV"
          # Set for the later steps only when given: `cargo xtask app` reads it.
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Imported the signing certificate into a temporary keychain."

      # The Mac app and its update archive. The archive is signed with the updater key on a
      # release only; on main there is no key in the build and the step says it skipped signing.
      - name: cargo xtask app
        if: runner.os == 'macOS'
        run: cargo xtask app --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      # Proves the signature. Fails when a signing secret was given and the app is still ad hoc.
      - name: Check the app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # `cargo xtask app` writes the bundle to dist/app.
          app=dist/app/Toknila.app
          test -d "$app" || { echo "$app not found"; exit 1; }
          info=$(codesign -dv --verbose=2 "$app" 2>&1)
          echo "$info"
          if echo "$info" | grep -q '^Signature=adhoc'; then
            if [ "$SIGNING_GIVEN" = "true" ]; then
              echo "::error::A signing certificate was given but the app is signed ad hoc"
              exit 1
            fi
            echo "The app is signed ad hoc (no signing secrets): macOS will treat every build as a new app."
          else
            echo "Signed with: $(echo "$info" | grep '^Authority=' | head -n 1)"
          fi

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: app-${{ matrix.target }}
          path: |
            dist/app/*.dmg
            dist/app/*.app.tar.gz
            dist/app/*.app.tar.gz.sig
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the notes are the pull requests merged since the previous tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and latest.json
        run: |
          cargo xtask release-notes "$TAG" > notes.md
          cat notes.md
          cargo xtask latest-json dist "${TAG#v}" notes.md
          cat dist/latest.json

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(mktemp)
          {
            echo "## What changed"
            echo
            cat notes.md
            echo
            echo "## Install"
            echo
            echo "The Mac app is \`Toknila-${TAG#v}-aarch64.dmg\` (Apple silicon) or \`Toknila-${TAG#v}-x86_64.dmg\` (Intel). Installed apps update themselves."
            echo "The command-line archives are \`toknila-${TAG#v}-<platform>\`. Steps: [docs/install.md](https://github.com/${{ github.repository }}/blob/$TAG/docs/install.md)"
            echo
            echo "The binaries are not notarised; on macOS download with curl or run \`xattr -dr com.apple.quarantine .\` in the unpacked folder."
          } > "$body"
          gh release create "$TAG" dist/* --title "Toknila $TAG" --notes-file "$body" --verify-tag
