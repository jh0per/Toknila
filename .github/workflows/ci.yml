name: CI

on:
  push:
    # `ci/**`: a branch pushed there gets the full run before it reaches main.
    branches: [main, develop, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main is never cancelled: the release waits for the CI run of the tag's commit
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job, not hold a runner for six hours. A slow Windows runner has
    # taken 12 min for verify, 10 for e2e-web and 6+ for the release build (2026-11-13), so the
    # limit leaves room above that; every wait inside the tests has its own deadline.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components; this only installs them.
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Builds the page the daemon embeds; the daemon test then requires it.
      - name: cargo xtask web
        run: cargo xtask web

      # `cargo xtask verify` runs the tests with it when present (and says so), else with cargo test.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The same command developers run locally. Do not inline its steps here.
      - name: cargo xtask verify
        run: cargo xtask verify
        env:
          TOKNILA_REQUIRE_WEB: "1"

      # TOKNILA-162 measurement (temporary, removed before merge): the terminal probe's numbers.
      - name: Terminal probe numbers (Windows, TOKNILA-162 temporary)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p toknila-daemon --test terminal_lines --locked -- --nocapture

      # Time of each step and of each test (junit), also when verify failed.
      - name: Upload verify timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-timing-${{ matrix.os }}
          path: |
            target/verify-timing.json
            target/nextest/default/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: cargo xtask e2e-web
        # TOKNILA-162 temporary: also after a failed verify, so the terminal spec's numbers come.
        if: always()
        run: cargo xtask e2e-web
        env:
          # Failed scripts leave a screenshot and a trace here; the smoke script's shots always land here.
          E2E_ARTIFACTS: ${{ github.workspace }}/apps/web/e2e-artifacts
          SHOTS_DIR: ${{ github.workspace }}/apps/web/e2e-artifacts/smoke

      # TOKNILA-162 measurement (temporary, removed before merge): five more samples of the spec
      # that lost lines once in six Windows runs.
      - name: Terminal copy spec five more times (Windows, TOKNILA-162 temporary)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: apps/web
        run: |
          for i in 1 2 3 4 5; do
            echo "== terminal-copy sample $i"
            node e2e/terminal-copy.mjs ../../target/debug/tok.exe ../../target/debug/fake-agent.exe || echo "== sample $i FAILED"
          done

      # Windows has no `ps`, so xtask's leak check is skipped there: list what the e2e run left
      # before the smoke test and fail with the command lines (a fake agent that outlived its spec
      # was killed by the runner at the end of the job, run 43470886692).
      - name: No daemon or fake agent left after e2e (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = @(Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(tok|toknila|fake-agent)(\.exe)?$' })
          if ($left.Count -gt 0) {
            $left | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" } | Write-Host
            throw "$($left.Count) tok, toknila or fake-agent process(es) left after e2e-web"
          }
          Write-Host 'no tok, toknila or fake-agent process left'

      # On failure, and on main (the smoke screenshots), so a UI test can be seen without a rerun.
      - name: Upload e2e screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: apps/web/e2e-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke-test release binaries
        shell: bash
        run: |
          cargo build --release --locked --bin toknila --bin tok
          ./target/release/toknila --version
          ./target/release/tok --version

  # The Tauri shell needs the platform web view, so it has its own job; macOS is the first target.
  desktop:
    name: desktop (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: cargo xtask desktop
        run: cargo xtask desktop
