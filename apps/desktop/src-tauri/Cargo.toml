[package]
name = "toknila-desktop"
description = "Toknila desktop shell: a window around the daemon's web page."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace: Tauri needs the platform web view (WebKit on macOS, WebView2 on Windows,
# WebKitGTK on Linux), so the main workspace and `cargo xtask verify` do not build it.
# `cargo xtask desktop` does.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
