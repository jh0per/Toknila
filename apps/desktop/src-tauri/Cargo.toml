[package]
name = "toknila-desktop"
description = "Toknila desktop shell: a window around the daemon's web page."
version = "0.2.7"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace: Tauri needs the platform web view (WebKit on macOS, WebView2 on Windows,
# WebKitGTK on Linux), so the main workspace and `cargo xtask verify` do not build it.
# `cargo xtask desktop` does.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-window-state = "=2.4.1"

[features]
# On for `cargo xtask app` (what `cargo tauri build` turns on): serve the bundled start page
# instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
