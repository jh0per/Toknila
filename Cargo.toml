[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli", "xtask"]
default-members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/jh0per/Toknila"
publish = false

[workspace.dependencies]
toknila-core = { path = "crates/core" }
toknila-daemon = { path = "crates/daemon" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ulid = { version = "3.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
