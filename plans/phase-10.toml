[[ticket]]
id = "queued-message-keeps-its-note"
title = "A second message to the assistant keeps its note until the assistant reaches it"
prompt = """
What happens today (from TOKNILA-125). While the assistant answers, a second message typed by the person shows "sent, the assistant reads it after this answer" (`QUEUED_NOTE`, apps/web/src/views/ChatMessage.tsx, testid `chat-queued`). The queued set is not stored: `openTurn()` in apps/web/src/store/conversation.ts walks back from the newest message to the last `assistant` message, so the moment the first answer arrives the second message is behind an answer, the note goes, `unanswered()` is empty, and the waiting line of apps/web/src/views/WaitingLine.tsx disappears, although the second message has had no answer yet. Nothing on the server knows about a queue: `post_conversation` (crates/daemon/src/http/routes/conversation.rs) stores the message and `ask()` in apps/web/src/store/plannerEffects.ts types it into the planner's terminal, where Claude Code's own input queue holds it.

Build this.

1. A turn is a message and the answer that follows it, not "everything after the last answer". In conversation.ts, pair person messages with assistant answers in order (the n-th answer after a message answers the n-th unanswered message; the planner answers one message per turn, which `say` enforces); `openTurn()` returns the oldest person message without an answer as `asked` and the later ones as `queued`. When one answer arrives, the next queued message becomes `asked`: its note changes to the waiting line ("The assistant is answering…" with its minutes counted from that answer, not from the send), and the ones behind it keep their note.

2. When the assistant's turn is on (TOKNILA-127 adds `working` and `since` to `PlannerState`; if it is on main when this story runs, use it: a message is answered only when the turn that followed it ended; if it is not on main, the pairing of item 1 alone, and say so in the hand-in). Never both heuristics at once: one function decides, with a comment saying which facts it uses.

3. A message the assistant will never reach says so. If the planner stops (its run ends, `running: false`) while messages are queued, their note reads "the assistant stopped before reading this; send it again" with a Send-again control that posts the same text; the stop of a planner is already in the store (plannerEffects.ts).

4. Tests, red first and quoted: web unit tests of `openTurn()` with two messages and one answer (the second becomes asked), with three messages and two answers, with a stopped planner; an e2e with the fake planner (`// needs: fake-agent`) that sends two messages while the first answer is slow and checks the second's note survives the first answer and then clears with the second answer. Run `cargo xtask web`, `cargo xtask e2e-web`.

Keep the change inside apps/web (conversation store, ChatMessage, WaitingLine, plannerEffects) and the e2e. No daemon change unless item 2 needs a field that is not there; then say so.
"""
acceptance = [
  "A second message sent while the assistant answers keeps its note after the first answer and becomes the awaited one, with the waiting line counting from that answer; a third stays queued",
  "When the assistant stops with messages unread, each says so and offers Send again",
  "Covered by web unit tests and an e2e with the fake planner seen red first",
]

