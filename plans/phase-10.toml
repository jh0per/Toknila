5. Tests, red first and quoted in the hand-in: handin.rs parses the block and refuses nothing old; `to_body` round-trips the typed field through a stored comment; the snapshots; a web unit test of `needsYou` with a typed block, with a verdict's PERSON items, and with an old free-text hand-in; a daemon http test that a hand-in with the block reaches the card's detail typed. Run `cargo xtask web` and `cargo xtask verify`.

