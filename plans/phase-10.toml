[[ticket]]
id = "e2e-leaves-nothing-behind"
after = ["new-epic-has-a-title", "queued-message-keeps-its-note"]
title = "An e2e run leaves no daemon and no fake agent behind, on every exit path and every OS"
prompt = """
What happened. A `tok` test daemon and its `fake-agent` from the e2e run of a phase-7 ship lived a day under launchd after the card merged (found 2026-11-13); on Windows CI the runner killed an orphan `fake-agent` at the end of the verify job (run 43470886692). The reasons are in the code: of the nineteen specs in apps/web/e2e that declare `// needs: fake-agent`, only lost-answer.mjs kills the fake agents it started (`processesWith(marker)` in `lose()` and in `finally`); the other eighteen (ask-story, ask-attach, assistant-panel, assistant-chat, discuss, commands, design-pins, design, planner, planner-progress, roadmap-assistant, terminal-copy, questions, question-choices, sidebar-nodes, screens, terminal, voice) call only `cleanup()` in apps/web/e2e/helpers.mjs, which stops the daemon and removes the home; a fake agent the daemon did not end before dying stays. `cargo xtask verify` ends with `leaks::check` (xtask/src/leaks.rs: daemons whose TOKNILA_HOME is under the run root TOKNILA_TEST_ROOT), but `cargo xtask e2e-web` has no leak check at all, and a spec that dies on a signal or a thrown error before `finally` leaves its daemon.

Build this.

1. One place owns the cleanup. helpers.mjs gives every spec a `session()` (or the name that fits) that makes the temp home, knows the fake agent's marker for that home, and registers one cleanup that runs on `finally`, on `process.on("exit")`, on SIGINT and SIGTERM, and on an uncaught error: stop the daemon (as `stopDaemon` does today, kill after the wait), then kill every process whose command line carries the marker (`processesWith`, both OSes), then remove the home. Every spec uses it; the profile each spec writes for the fake agent carries the marker in its arguments so `processesWith` finds it (lost-answer.mjs shows the pattern). A spec that starts a second daemon (anywhere) registers it the same way.

2. e2e-web checks for leftovers itself. After the specs, `e2e_web()` in xtask/src/main.rs runs the same leak check as verify, extended: daemons whose TOKNILA_HOME is under the e2e temp homes (the specs make them under the OS temp dir with a known prefix; use one prefix, say `toknila-e2e-`, for every spec) and every `fake-agent` process whose command line carries one of this run's markers (the run passes a run id to the specs through an environment variable; the marker contains it). A leftover fails the run with its pid, command line and the spec it belongs to.

3. Verify tells about older leaks without failing. `leaks::check` lists daemons and fake agents of the same data home older than an hour that are not under this run's root, naming their TOKNILA_HOME and age, as a warning: "a daemon from <home>, alive for 26 h; another run left it". Never kill what this run did not start.

4. On Windows the job lists what is left before the smoke test. In .github/workflows/ci.yml, a step after e2e-web lists `tok`, `toknila` and `fake-agent` processes (PowerShell `Get-CimInstance Win32_Process`) and fails with their command lines when any exists. The helper's kill on Windows uses `taskkill /T /F` or `process.kill` on the pid; check it ends the fake agent's children too.

5. Tests, red first and quoted: a node test (or a tiny spec) that starts a daemon and a fake agent through `session()`, throws before `finally`, and a second process checks nothing of that marker is alive; the xtask leak check with a fake leftover (a `fake-agent print <marker>` started by the test and left) fails naming it; `cargo xtask e2e-web` green with no leftovers on this Mac, quoted; verify's warning path with a planted old daemon.

Keep the change inside apps/web/e2e (helpers and every spec's cleanup lines, nothing else in the specs), xtask (main, leaks), .github/workflows/ci.yml, and docs (AGENTS.md's e2e paragraph: a spec never starts a process outside `session()`).
"""
acceptance = [
  "Every e2e spec gets its daemon, home and fake agents from one helper that ends all of them on finally, exit, signals and uncaught errors; e2e-web fails on a leftover of its own run naming pid, command and spec",
  "verify warns about daemons and fake agents of the data home older than an hour that another run left, without killing them; the Windows job fails on leftover processes before the smoke test",
  "Covered by a node test of the helper's exit path, an xtask test with a planted leftover, and a green e2e-web quoted"
]

[[ticket]]
id = "e2e-web-ensures-the-browser"
title = "cargo xtask e2e-web makes sure Playwright's browser is there, and never prunes another version's"
after = ["e2e-leaves-nothing-behind", "needs-you-reads-the-hand-in"]
prompt = """
What happened (2026-11-13). `cargo xtask e2e-web` on main failed with "Executable doesn't exist at ~/Library/Caches/ms-playwright/chromium_headless_shell-1243/..." although apps/web/package.json pins playwright 1.63.0 and the same command had run green an hour before: ~/Library/Caches/ms-playwright held only ffmpeg and webkit. Playwright removes browser builds that no installed Playwright version needs when `npx playwright install` runs for another version, so an agent in a ship (or another project on the machine) pruned ours. `e2e_web()` in xtask/src/main.rs runs `npx playwright install chromium` only when `CI` is set (line ~147); locally a missing browser is a red gate with a confusing message.

Build this.

1. Before the specs, `e2e_web()` asks Playwright where its Chromium is and whether it exists: `npx playwright install --dry-run chromium` prints the install location per browser (or read it from the `playwright-core` package's `browsers.json` and the registry path), and when the executable is missing it runs `npx playwright install chromium` (with `--with-deps` on Linux as today) and prints one line saying it did. When present, nothing is printed. `CI` keeps today's behaviour. The check costs under a second.

2. Pruning is a mistake we name. The worker protocol (crates/core/src/instructions/protocol.rs, the tools or machine section) gains one sentence: never run `npx playwright install` yourself or with another Playwright version; `cargo xtask e2e-web` installs what it needs. Snapshots updated. AGENTS.md's e2e paragraph says the same for people.

3. Tests: an xtask unit test of the function that reads the location and decides (fed a dry-run output with and without the browser, and a path that exists or not); the snapshot test; a run of `cargo xtask e2e-web` after moving the browser folder aside (quote the "installing" line) and a second run that prints nothing extra. Red first.

Keep the change inside xtask, crates/core instructions and snapshots, AGENTS.md.
"""
acceptance = [
  "cargo xtask e2e-web finds Playwright's Chromium missing and installs it before the specs, saying so in one line; a present browser costs nothing visible",
  "The worker protocol and AGENTS.md say never to run npx playwright install by hand or with another version",
  "Covered by an xtask unit test, the snapshot test and two quoted runs"
]
