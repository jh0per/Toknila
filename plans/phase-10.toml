prompt = """
What happened. BEATSTER-7's hand-in left one step to the person: a check on an iPhone (the 808 Long and Crash pads in the editor, the 32-step drag, the pedals on a playing loop). The Review card's "Needs you" block (apps/web/src/views/NeedsYou.tsx, from TOKNILA-120) read "Nothing to do by hand; Accept when the hand-in convinces you", because `needsYou` (apps/web/src/store/needsYou.ts) keeps only lines that start with the word PERSON, and the agent wrote its step in plain words under Left. PERSON is a typed outcome on the reviewer's side (`ItemOutcome::Person` in crates/core/src/model/review.rs) and nothing at all on the worker's side: the hand-in is parsed as text in crates/core/src/handin.rs (`Sections`: changed, checks, left; `to_body` stores gist, what, how_to_verify, consequences) and the worker protocol (crates/core/src/instructions/protocol.rs) never tells the agent to mark a step for a person. The window promises a list it cannot fill.

Build this.

1. The hand-in has a fourth block: "For you" (or the name the hand-in template uses for the person; keep it one word in the template), after Left: each line one step a person does by hand, written for the person who will read it (the screen and the control as the window shows them, the device if it is not this computer, what they should see), no task ids, no file paths unless the person must open the file. `handin.rs` parses it into `Sections` and `to_body` stores it typed (a new field of the hand-in body, or `person: Vec<String>`, whatever the stored `CommentBody` can gain without `deny_unknown_fields`; see the stored-types rule in AGENTS.md). A hand-in whose Left or Checks block names a check on a device or screen a person must do, in the old free form, is still accepted; the block is where such steps belong from now on.

2. The protocol says so. In protocol.rs the hand-in bullet gains the rule: a check you cannot run yourself (a device you do not have, a window you cannot see, a sound) goes under "For you" as a step the person can follow, one per line; it is never buried in Left and never a question in `ask_human` at the hand-in. The hand-in template in handin.rs shows the block. Snapshots run.md, run_design_first.md and run_replacement.md updated with TOKNILA_UPDATE_SNAPSHOTS=1 and the diff read.

3. The window reads the typed field first. `needsYou` lists the typed steps of the hand-in, then the reviewer's PERSON items; the PERSON-line scan of the free text stays as the fallback for hand-ins made before this story. The inbox row of a Review card says "N steps for you" when the list is not empty. `tok inbox` and `tok show` print the block.

