# Phase 10: the backlog, closed. What the last four phases left as candidates in the orchestrator's
# notes, triaged on 2026-11-15 against v0.3.3; the owner asked how much is left and said to go on.
# Import: tok chain import plans/phase-10.toml --project TOKNILA
#
# Left out on purpose: the Windows terminal losing the first lines of an agent's output (ConPTY;
# needs a person with Windows), and the planner routes folded into the card routes (no user value).
# The owner's own epic "Асистент показує, що робить" (TOKNILA-127..129, v0.3.5) runs beside this one.
#
# `after` names the cards whose files a card shares; a card without `after` may run at once.

[chain]
name = "phase-10"
title = "The backlog, closed"
goal = "Accept and Release need no hand work from the orchestrator, a hand-in says what a person must do, the window names epics the way people do, and a test run leaves nothing behind"
autostart = true
version = "0.3.4"

[[ticket]]
id = "accept-reruns-the-check"
title = "Accept checks again when main moved, and runs the checks the changed files ask for"
prompt = """
What happens today. At the hand-in the daemon syncs the ship with main and runs the project's check command (TOKNILA-29; `Effect::RunCheck` in crates/core/src/machine/event.rs, `checks::queue_for` and `checks::run_on_host` in crates/app/src/checks.rs). At Accept, `merges::run` (crates/app/src/merges.rs) does `ships::guard`, then `host.merger.sync` (main merged into the ship once more), then `host.merger.merge`: the check is not run again, so a card checked against a main that has since taken three other cards merges on a stale result. `CheckOutcome` (crates/core/src/model/check_outcome.rs: command, passed, output, at) does not record which main commit the check saw; `Review.handed_in` is the ship's HEAD, not main's. And the project has one check command: Toknila's `cargo xtask verify` does not build the web bundle or run the browser specs, so every card that touches apps/web gets `cargo xtask web` and `cargo xtask e2e-web` from the orchestrator by hand before Accept. `Shipyard::changes_between` (crates/daemon/src/shipyard/inspect.rs, used only for `SinceReturn.files`) already lists the files a range changed.

Build this.

1. The check knows what it checked. `CheckOutcome` gains the main commit the ship was synced to (`base` or the name that fits) and the ship HEAD it ran on; `review::check_done` records them. `tok show` prints "checked against main at <short>" in the round.

2. Accept re-checks when main moved. In the Accept path, after the sync: if main's commit differs from the one the last passed check recorded (or no check recorded one), the card goes back through the check turn (the same `RunCheck` effect and round kind as at the hand-in; the round's comment says "main moved since the check: <n> commits"), and the merge follows a pass by itself, with no second Accept. A failing re-check is a round for the agent, as a hand-in check is (TOKNILA-102 already returns a conflict at Accept the same way). The Review card shows "being checked again" while it runs (the turn words of TOKNILA-53). If main did not move, the merge is immediate as today.

3. Checks for the files that changed. The project gains `extra_checks`: a list of `{ paths, command }` (paths as globs such as `apps/web/**`), set with `tok project set --extra-check 'apps/web/**=cargo xtask web && cargo xtask e2e-web'` (one flag per entry; `--clear-extra-checks`), shown and edited in the project Settings page under the check command, and in the API (crates/api-types; then `npm run gen`). At every check turn (hand-in, Return, re-check at Accept) the daemon lists the files the ship changed against the synced main (`changes_between`) and runs, after the check command, every extra check whose glob matches a changed file, in order, in the ship, each as its own line of the round ("extra check apps/web/**: PASS cargo xtask web && cargo xtask e2e-web, 4 min"); a failure is the round's failure with that output. The system check (TOKNILA-28's "check command OK") covers the extra commands too. The reviewer gets their results with the gate's (TOKNILA-82).

4. Words for people. docs/guide (the window's Guide section on Review, TOKNILA-80) gains two sentences: Accept checks again when other stories merged first; the project can name extra checks for parts of the code.

5. Tests, red first and quoted in the hand-in: core: `check_done` records base and head; the Accept transition goes to the check turn when the recorded base differs and merges when it is equal. App or daemon http tests with a temp repo and a fake check command: Accept after main moved runs the check once and then merges with no further action; a failing re-check returns the card to the agent as a round; an extra check runs only when a matching file changed, in the order given, and its line is in the round; the system check reports a missing extra command. CLI test of the `--extra-check` flag; a web unit test of the Settings rows. Run `cargo xtask web` and `cargo xtask verify`.

Keep the change inside crates/core (machine review and check phase, model check_outcome and project), crates/app (checks, merges, projects), crates/daemon (routes projects and tickets, shipyard inspect if a range helper is missing), crates/cli (project set, show), crates/api-types, apps/web (Settings project page, the turn words), docs, and the tests. A production file stays at or under 400 lines; `merges.rs` and `checks.rs` are near it, split before you add.
"""
acceptance = [
  "Accept of a card whose last check saw an older main runs the check again after the sync and merges on a pass by itself; a failure is a round for the agent; the round records the main commit it checked against",
  "A project can name extra checks per path glob in the CLI, the Settings page and the API; they run at every check turn for the files the ship changed and appear as lines of the round; the system check covers them",
  "Covered by core, app or daemon, cli and web tests seen red first",
]

[[ticket]]
id = "release-pushes-in-local-mode"
title = "A release in local mode can push main and the tag; the orchestrator pushes nothing by hand"
prompt = """
What happens today. The release run (crates/core/src/release_run.rs `ReleaseStep`: Check, Bump, Tag, Push; crates/daemon/src/releaser.rs) has a Push step that runs `git push --porcelain origin refs/heads/<base> refs/tags/<tag>`, but `project_steps` and `Plan.push` in crates/daemon/src/http/routes/releases.rs turn it on only when `merge.mode == MergeMode::Github`. Toknila itself is a local-mode project with a GitHub remote: every release since 0.2.12 ended with "Check, Bump, Tag ok" and the orchestrator pushing main and the tag by hand so that the Release workflow publishes. Neither the project nor the repo stores a remote name; `origin` is hard-coded in five places (github.rs, releaser.rs, shipyard.rs, shipyard/planner.rs, `ShipSpec::start_point`).

Build this.

1. Push is a choice of the release, not of the merge mode. The release request (the Release dialog of the Finish node, TOKNILA-32; `POST /chains/{chain}/release`; `tok release run`) carries `push: bool`. The dialog shows "Push main and the tag to origin" as a checkbox when the repository has a remote named origin whose URL the daemon can read (`git remote get-url origin` in the shipyard; the chain's detail or the project's detail carries `remote: Option<String>` for the window), on by default in github mode and when the base branch has an upstream, off when there is no remote (then the checkbox is absent and one line says "no remote: the tag stays local"). `tok release run <CHAIN> <VERSION> --push|--no-push`, default as the dialog.

2. The push step speaks. In the step list (`tok release steps`, the dialog's steps) Push reads "Pushed main and v0.3.4 to origin" with the remote's URL made into a link when it is GitHub (the tag page, `<url>/releases/tag/v0.3.4`), or the failure's git line verbatim ("rejected: non-fast-forward; pull first" is what a person reads most). A failed push leaves the run resumable at Push (TOKNILA-59's `resume_steps`), with a "Push again" control; Tag is not redone.

3. The remote is read, not assumed. One function in the shipyard answers the remote's name and URL for a project (origin when it exists, else the single remote, else none); the five hard-coded `origin`s of the release path (releaser.rs and the planner's fetch) use it; github.rs and the ship start point keep theirs unless the change is a one-liner (say in the hand-in which you changed).

4. Tests, red first and quoted: core: `steps(check, bump, push)` with push in local mode; daemon tests with a temp repo and a bare remote: a release with push lands main and the tag in the remote; without push nothing leaves; a rejected push (the remote moved) fails the step with git's line and resumes at Push; a repository with no remote gets no checkbox (`remote: null`) and refuses `--push` with a sentence; cli test of `--push`; a web unit test of the dialog's checkbox states; the existing release e2e extended by the checkbox. Run `cargo xtask web`, `cargo xtask e2e-web`, `cargo xtask verify`.

Keep the change inside crates/core (release_run, model release), crates/daemon (releaser, routes releases, shipyard remote), crates/cli (release run, steps), crates/api-types (then `npm run gen`), apps/web (the Release dialog and its steps), and the tests.
"""
acceptance = [
  "A release in local mode offers Push main and the tag to origin when a remote exists, on by default when the base has an upstream; tok release run takes --push/--no-push",
  "The Push step says what it pushed with a link, or git's failure line, and a failed push resumes at Push without redoing Tag; a project without a remote says so instead of a checkbox",
  "Covered by core, daemon with a bare remote, cli, web and e2e tests seen red first",
]

[[ticket]]
id = "merged-through-github-retires-the-ship"
title = "A card merged by any path retires its ship; ships of merged cards are listed and cleaned"
after = ["accept-reruns-the-check"]
prompt = """
What happened. On 2026-11-15, 13 of the 15 merged cards of the owner's second project (github merge mode) still had their ship worktrees under `~/.toknila-ships/<project>/<epic>/` (registered in `git worktree list`), and `tok show BEATSTER-10 --json` still carried `ship` with branch and path; two cards (one merged with `tok merge-now`) were clean. TOKNILA-62 made a merged card leave nothing behind, through `merge::done` (crates/core/src/machine/merge.rs) → `Effect::RemoveShip` → `ships::queue_remove` (crates/app/src/ships.rs): in local mode it defers `ExternalEffect::RetireShip` (`GitShipyard::retire_ship`, crates/daemon/src/shipyard/retire.rs: worktree removed, `branch -D` unless the branch has commits beyond the base, then `ships::retired` deletes the record). In github mode `pr_watch::tick` → `merges::poll` → `GithubMerger::step` sees MERGED → `landed` fetches and `merges::finished` sends `MergeDone` → `queue_remove` defers `ExternalEffect::RemoveShip` instead, which removes the worktree and the record but keeps the local branch; and on the owner's machine not even that happened: records and worktrees stayed. Find out why on a copy of the path (the fake GitHub of the tests), then make every path the same.

Build this.

1. One retirement for every path. A card that becomes Merged by any path (the daemon's local merge, a pull request seen merged, `tok merge-now`, a person's Accept in a project with no merge at all) runs `RetireShip` with the start point the ship was made from (`ShipSpec::start_point`, `origin/<base>` in github mode): worktree, local branch (kept only when it has commits beyond what merged, with a journal line saying so), record. `RemoveShip` keeps its other uses (cancel) or goes if it has none. The reason the owner's ships stayed is named in the hand-in with the test that reproduces it.

2. Recovery cleans up after an old daemon. At daemon start (crates/app/src/recovery.rs) a ship record whose card is Merged or Cancelled is retired as in item 1, logged once per ship; a worktree folder under the project's ships root that no record names and no running card owns is listed in the log as unknown, never deleted.

3. People can see them. `tok ship ls` (crates/cli, the `ship` command) gains the card's status and marks ships of merged cards; Settings → the project's page (or the Agents node's workspace table of TOKNILA-113) lists "Workspaces: N, of which M belong to finished stories" with a "Clean up" control that retires them (`POST /projects/{project}/ships/retire-finished`, person only). The `_planner` folder (the assistant's reading copy) is named as such in the list and never counted as a leftover.

4. Tests, red first and quoted: an app or daemon test per path (local merge, github merge through the fake GitHub, merge-now, no-merge Accept) asserting worktree gone, branch gone or kept with the journal line, record gone; recovery with a planted record of a merged card; the route and the CLI; a web unit test of the Settings line. Run `cargo xtask web` and `cargo xtask verify`.

Keep the change inside crates/core (machine merge if an effect changes), crates/app (ships, merges, recovery, projects), crates/daemon (shipyard retire, routes), crates/cli (ship ls), crates/api-types (then `npm run gen`), apps/web (the Settings or Agents table), and the tests.
"""
acceptance = [
  "A card merged by any path (local merge, pull request merged on GitHub, merge-now, no-merge Accept) ends with its worktree, branch and record gone, or the branch kept with a journal line naming why; the cause of the leftover ships is named with a reproducing test",
  "Daemon start retires ships of merged and cancelled cards; tok ship ls and the project's Settings show workspaces of finished stories with a Clean up control",
  "Covered by app or daemon tests per path, a recovery test, cli and web tests seen red first",
]

[[ticket]]
id = "three-loose-ends-of-reviewer-threads-pty"
title = "Three loose ends: the reviewer's npm rules, a second thread's refusal, and a pty that is not there"
prompt = """
Three small things found in runs, each with its place in the code.

1. The reviewer may run the web gates of a repository whose package.json is not at the root. `reviewer_check_rules` and `AgentProfile::with_reviewer_checks` (crates/core/src/model/reviewer_rules.rs) add `Bash(npm test *)` and `Bash(npm run *)` only when `repo_tools(dir)` finds package.json at the repository root; Toknila's is apps/web/package.json, so the reviewer of every web card wrote NOT_RUN for `npm run gen:check` (TOKNILA-85's reviewer, and others). Make `repo_tools` look one level down into the folders the check command names and into `apps/*`, `packages/*`, `web/*` (list the folders it found), and tell the reviewer in its kickoff which commands it may run and from where ("npm run --prefix apps/web gen:check"). Test with a temp repo whose package.json sits in apps/web.

2. A refused second thread names the first. `threads::open` (crates/app/src/threads.rs) refuses an agent's second thread of the same kind with `DuplicateKind` (TOKNILA-48 opened an empty duplicate before this guard existed). The tool's error text the agent reads should say what to do: "thread 2 (design) is open on this story: post your new version there with thread_version; a second design thread is not the way". Check the text the MCP tool returns (crates/cli/src/cmd/mcp_tools.rs → `AgentEvent::OpenThread` in crates/app/src/agent.rs) and pin it in a test. The HTTP route (a person) keeps accepting a second thread.

3. A pty that cannot be opened is a machine state, not a crash. `spawn` in crates/daemon/src/runner/pty.rs calls `native_pty_system().openpty(SIZE)`; on a loaded Mac it failed once with "failed to openpty: Unknown error: -6" (ENXIO, no free pty) and the card was Blocked as Crashed with that line (`runs::start_failed`, crates/app/src/runs.rs). Make the error typed (`RunnerError::NoPty`), retry the open once after a short wait (under a second) before giving up, and when it still fails block the card with a reason a person can act on: "No free terminal on this computer (every pty is in use). Close some terminals or agents and press Unblock." The reviewer's start takes the same path (`reviews::start_failed`). Tests: a unit test of the mapping from the OS error to `NoPty` and of the one retry (inject the pty system or the open function); a daemon test that a `NoPty` failure blocks with that reason. Also: the tests that open ptys (crates/daemon/tests/runner.rs, crates/cli/tests/pty_runner.rs) share one lock (a `static Mutex` in a small test-support module, or `--test-threads` for those files in xtask verify, whichever the current test layout allows without a new crate) so that a loaded machine does not run them all at once; say in the hand-in how many ptys the suite opens at its peak before and after.

Every test red first and quoted. Run `cargo xtask verify`. Keep the change inside crates/core (reviewer_rules), crates/daemon (runner pty, wiring, the reviewer kickoff), crates/app (threads, agent, runs, reviews), crates/cli (mcp_tools if the text lives there), and the tests.
"""
acceptance = [
  "The reviewer of a repository with apps/web/package.json gets npm rules and is told the commands it may run from where; a reviewer's NOT_RUN for gen:check is gone in the fixture test",
  "An agent's second thread of a kind is refused with a sentence naming the open thread and thread_version; a pty that cannot be opened is retried once and then blocks the card with a sentence a person can act on, never as a crash",
  "Covered by core, app and daemon tests seen red first; the pty tests share a lock and the hand-in says the peak number of ptys",
]

[[ticket]]
