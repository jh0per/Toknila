prompt = """
What happened (run 12). TOKNILA-131's daemon check failed twice on crates/client's EINVAL test, a test its change does not touch, while the machine was loaded by the owner's other work (load average 150+); each failure counted as one of the card's three rounds and sent the agent to "fix" what it had not broken. The agent asked the person instead of guessing, which cost a person turn too. A test that passes when run again is a flaky test: real, worth a card, but not the card's fault.

Today the check turn (crates/app/src/checks.rs `run_on_host`, `checks::queue_for`; the round written by `review::check_done` in crates/core/src/machine/review.rs; `CheckOutcome` in crates/core/src/model/check_outcome.rs, which since TOKNILA-130 records `base` and `head`) runs the command once and a failure is a round for the agent.

Build this.

1. One more run on a failure. When the check command (or an extra check of TOKNILA-130) fails, the daemon runs the same command once more on the same commit, right away, in the same line of the machine-wide check queue (TOKNILA-28). If the second run passes, the check passes: the round says "The check passed on the second run; the first failed:" followed by the first run's last 30 lines, and `CheckOutcome` records `flaky: true` with that output. If it fails again, the round goes to the agent as today with the second run's output. A command that cannot run (exit 127, "command not found": U12's machine problem) is not run again.
