# Phase 11: the rest of the backlog. The owner's words on 2026-11-16: "доробити весь беклог"
# (finish the whole backlog). Triaged against v0.3.5 the same hour: what phases 5 to 10 did not
# close, what run 12 found, and what CI showed after the 0.3.4/0.3.5 tags. Includes the two items
# earlier phases left out on purpose (the Windows terminal's lost lines and the planner routes
# folded into the card routes), because the owner asked for the whole backlog twice.
# Import: tok chain import plans/phase-11.toml --project TOKNILA
#
# `after` names the cards whose files a card shares; a card without `after` may run at once.

[chain]
name = "phase-11"
title = "The rest of the backlog"
goal = "Nothing left in the orchestrator's notes: a release never ships a red main, a waiting agent never takes a slot it does not have, a flaky test never costs a round, the reviewer reads what it reviews, tests never start a real agent, and the planner's routes are the card routes"
autostart = true
version = "0.3.6"

[[ticket]]
id = "release-waits-for-ci"
title = "A release is published only after CI passed on the same commit"
prompt = """
What happened (2026-11-15). Toknila's own release runs tagged v0.3.4 and v0.3.5 and pushed them; .github/workflows/release.yml built and published both (its `publish` job `needs: build` only), while .github/workflows/ci.yml on the very same commits was red on every OS: a Windows daemon stack overflow at startup and two cli tests that started the real agent. Four fix commits followed on `main` after the tags. The local release run's Check step runs `cargo xtask verify` on this Mac only, so it cannot see a Windows or Linux failure.

Build this.

1. The publish waits for CI. In release.yml, before anything is uploaded or `latest.json` changes, a job waits for the CI workflow run of the tag's commit (the `push` to `main` that carried the same SHA; `gh api repos/{owner}/{repo}/actions/runs?head_sha=<sha>&event=push` filtered by the CI workflow's name or file) to finish, and fails with one line naming the run's URL and its failed jobs when its conclusion is not `success`. It polls with a pause of at least 60 s between calls (the API has a rate limit) and gives up after 90 minutes with a line saying so. When no CI run exists for the SHA (a tag pushed alone), it dispatches nothing and fails with "push main with this commit first; CI must run on it". `publish` needs that job. A manual `workflow_dispatch` of an existing tag waits the same way.
2. The local release says so. The release run's Push step (crates/daemon/src/releaser.rs, TOKNILA-131), after a successful push, adds one line to its step text: "GitHub publishes after CI passes on <short sha>". docs/guide (the Release section) gets the same sentence.
3. Tests and proof. The wait is a small script under .github/scripts/ (shell or a tiny Python with no packages) with its own test that feeds recorded API answers (success, failure with two failed jobs, still running then success, no run) and checks the exit code and the line; run it locally and quote the four results. Do not push a tag to test it. A daemon test for the Push step's new line. Run `cargo xtask verify`.

Keep the change inside .github/workflows/release.yml, .github/scripts/, crates/daemon (releaser), docs. Never print or touch the updater's signing key or any secret.
"""
acceptance = [
  "release.yml publishes only after the CI run of the tag's commit succeeded, fails with the run's URL and failed jobs otherwise, polls at most once a minute and gives up after 90 minutes; a tag with no CI run fails with a sentence",
  "The release run's Push step and the guide say GitHub publishes after CI passes",
  "The wait script is tested against recorded API answers (four cases quoted); a daemon test covers the Push line",
]

