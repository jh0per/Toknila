[[ticket]]
id = "windows-terminal-keeps-its-head"
title = "On Windows the terminal of an agent keeps the first lines of its output"
after = ["tests-stay-inside"]
prompt = """
What is known. On Windows CI the e2e spec apps/web/e2e/terminal-copy.mjs saw the scrollback of an agent that printed 80 numbered lines start at "scroll line 11", while macOS and Linux start at line 1; the spec was relaxed for Windows only (the `whole` regex around line 171, commit 093eb21, 2026-11-13) with the comment "the lost head is a Windows terminal matter of its own". The runner opens the agent's terminal with portable-pty 0.9 (crates/daemon/src/runner/pty.rs `spawn`, a fixed size `SIZE`); on Windows that is ConPTY, which renders a screen and emits VT sequences for it rather than passing the program's bytes through, so output that scrolls off before ConPTY renders may never reach the stream. The scrollback the page shows comes from the run's log (the pty reader writes it) and the live stream.

Find out and fix, on the only Windows machine available: GitHub's Windows runner.

1. Make the spec strict on every OS again (expect "scroll line 1" first on Windows too) and add, in a small daemon test or the spec, a probe that records what the pty reader received first on Windows (the first bytes of the run log), so a failing run says which layer lost the lines: the reader, the log, or the page.
2. Run it on Windows CI by pushing your branch to `ci/toknila-<number>` (the CI workflow runs on `ci/**`). Rules: at most six pushes in total; between pushes look at the run with `gh run view <id>` no more than once every 15 minutes (never `gh run watch`; the GitHub API has a rate limit shared with the person); never push to `main` or a tag.
3. Fix the layer that loses them. Candidates to try in this order, each kept only if CI shows it works: start the reader before the child process writes (the order in `spawn`), give ConPTY a taller screen (rows) so 80 lines do not scroll before the first render, or on Windows read the agent's output with ConPTY's passthrough mode if portable-pty 0.9 exposes it (check its source; do not upgrade the crate without a sentence why). If no fix holds after six runs, keep the strict spec only where it passes, leave the Windows relaxation with a comment that names the evidence, and say so in the hand-in: that is an acceptable outcome, a guess is not.
4. Run `cargo xtask verify` and `cargo xtask e2e-web` on this Mac too.

Keep the change inside crates/daemon (runner pty and its tests), apps/web/e2e/terminal-copy.mjs, and nothing else. Name in the hand-in each CI run's URL and what it showed.
"""
acceptance = [
  "The cause of the lost first lines on Windows is shown by a probe on the Windows CI runner, naming the layer that loses them",
  "Either the spec is strict on Windows and passes there after a fix, or the relaxation stays with a comment naming the evidence; never a guess",
  "At most six ci/ pushes, gh run view at most every 15 minutes, nothing pushed to main or a tag; verify and e2e-web green on this Mac",
]

