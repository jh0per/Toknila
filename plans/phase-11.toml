- what the planner's MCP tools (crates/cli/src/cmd/mcp_tools.rs and the planner tool list) call afterwards, and that their tool names, arguments and answers do not change (the planner's instructions and snapshots stay as they are);
- how old clients keep working during the change (the planner routes stay as thin aliases for one release, answering the same, then go), and how the OpenAPI document changes;
- the order of the steps, each leaving `main` green.
Wait for the person's approval; the approved thread wins over this text.

Then build it in the approved steps. Rules that hold throughout: every existing test that pins a planner refusal (403s in crates/daemon/src/http/tests and crates/cli/tests/planner.rs, the list test in auth.rs) passes unchanged or moves with a sentence in the hand-in; a planner still starts nothing, accepts nothing, and edits only what TOKNILA-124 allows; a card agent's token still reaches only its own ticket's routes; the window and the CLI need no change beyond regenerated types. Run `cargo xtask verify`, `cargo xtask web`, `cargo xtask e2e-web` at every step you commit.

Keep the change inside crates/daemon (server auth, http routes), crates/app (the `may` rule and the use cases the planner routes call), crates/core (if the rule is pure), crates/cli (mcp tools' paths), crates/api-types and the generated files, docs/architecture.md, and the tests. A production file stays at or under 400 lines.
