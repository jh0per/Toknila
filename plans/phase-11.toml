Build this.

1. "The hand-in" section. The reviewer's instructions carry, after "The gate's result", the latest hand-in of the card as the worker wrote it: What changed, Checks, Left and For you (TOKNILA-134), from the stored hand-in body (`CommentBody`: gist, what, how_to_verify, consequences and the For-you field). After a Return the section also carries "Since the Return" (U8's `SinceReturn`, the files changed since). The kickoff's sentence points to it: "run the single tests the hand-in names (in The hand-in)". The instructions builder gets the hand-in through `RunBrief` (crates/core/src/instructions/mod.rs) from the daemon's run wiring (crates/daemon/src/runner/ or crates/app/src/runs.rs, wherever the reviewer's brief is filled).
