prompt = """
Why. The daemon has two sets of routes for the same things: the person's (`/v1/chains/...`, `/v1/tickets/...`, `/v1/projects/...`) and the planner's (`/v1/planner/chains`, `/v1/planner/chains/{chain}/cards`, `PATCH /v1/planner/cards/{card}`, edges, moves, threads, pins, suggestions, and the reads `plan`, `overview`, `chains/{chain}`, `cards/{card}`, `designs/{design}`: the list `PLANNER_ROUTES` in crates/daemon/src/server/auth.rs). Each planner route re-implements what the person's route does, with the planner's limits (it starts nothing, accepts nothing, edits only what `planner::ensure_story_target` of TOKNILA-124 allows) mixed into the handler. Every new rule has had to be written twice and drifted once (the roadmap context of TOKNILA-124 lived in prose until a daemon rule was added). The code audit of 2026-11-08 named it; the owner asked for the whole backlog.

This story is design first and runs on a stronger model: it changes the API that the window, the CLI and the planner's MCP tools all use. Before any code open a thread of kind architecture with:
- the target: one route per action, the caller's principal (person, planner of project P, card agent of ticket T, reviewer) decides what it may do, in one place (auth.rs's principal plus an app-level `may(principal, action, target)` in crates/app or core, never inside handlers);
