4. Tests, red first and quoted: an app or daemon test with a check command that fails the first time and passes the second (a counter file or `git config` entry as crates/daemon/tests/recheck_at_accept.rs does; never a shell redirect, it must run in `cmd.exe` too): the round passes, `flaky` is set, the inbox item exists; a command that fails twice is a round with the second output; exit 127 runs once; the gate snapshot. Run `cargo xtask verify` and `cargo xtask web`.

