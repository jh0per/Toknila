# Phase 1 (MVP): an agent really moves a ticket. Toknila's own next chain, kept as data.
# Import: tok project new TOK && tok chain import plans/phase-1.toml --project TOK
# Then:   tok chain show phase-1
#
# One target, "move-in": the owner develops Toknila in Toknila.app on macOS, starting with
# Toknila itself. There is no intermediate release; distribution to other people comes later.
# The gate: Claude Code agents run on ships, two in parallel, report through MCP, go through
# review with return-with-comment rounds, and merge through a GitHub PR with green CI.
# Data survives upgrades.

[chain]
name = "phase-1"
goal = "Move-in: the owner develops Toknila in Toknila.app on macOS; Claude Code agents run on ships, two in parallel, report through MCP, go through review with return rounds and merge through a GitHub PR with green CI; data survives upgrades"
# Planned work, not a demo: nothing starts by itself until a person resumes it.
autostart = false

[[ticket]]
id = "profiles"
title = "Agent profiles as TOML"
prompt = "Load agent profiles from TOML: launch command, instructions file, MCP and hook wiring, role (worker / reviewer / release), output rules, nudge thresholds. A new agent is a new file, not new code."
acceptance = [
  "tok profile ls lists built-in sim and claude-code plus files from the profiles folder",
  "An invalid profile names the file and line",
  "Profile JSON is pinned by a snapshot test",
]

[[ticket]]
id = "ships"
title = "Ships: worktree per ticket from develop"
prompt = "Create a ship for a ticket: git worktree on branch ship/<chain>/<slug> from develop, removed after Merged. Cross-platform paths, no shell assumptions."
acceptance = [
  "Starting a ticket creates the worktree and branch; Merged removes the worktree",
  "Works on Windows, Ubuntu and macOS in CI against a temporary repository",
]

[[ticket]]
id = "pty"
title = "PTY runner"
prompt = "Run the profile's command on the ship in a pseudo-terminal (portable-pty in the daemon, never in core). Stream output to the web UI, keep a scrollback, survive daemon restarts by marking lost runners."
acceptance = [
  "A runner starts, streams output over WebSocket and stops on StopRunner",
  "Killing the daemon marks Running tickets Blocked(runner_lost) on restart",
]
after = ["profiles", "ships"]

[[ticket]]
id = "mcp"
title = "MCP server and hooks deliver agent events"
prompt = "Expose the agent event contract (docs/events.md) as an MCP server on the ship, and wire Claude Code hooks as a second source. Same events the sim profile takes today."
acceptance = [
  "An agent's started / ask_human / subtask_done / note / finished / crashed move the ticket exactly like tok sim",
  "Events from a ship that does not own the ticket are rejected",
]
after = ["pty"]

[[ticket]]
id = "nudge"
title = "Silence detector and nudge loop"
prompt = "Detect silence: MCP first, hooks second, output silence as the fallback. Nudge after 120 s of silence with no child process, up to 3 times in 15 min, then Waiting(silent). Thresholds come from the profile."
acceptance = [
  "Unit tests with a fake clock cover nudge, the limit and the move to Waiting",
  "A real child process (a build) suppresses the nudge",
]
after = ["mcp"]

[[ticket]]
id = "claude-md"
title = "Generated CLAUDE.md with short-output rules"
prompt = "Generate CLAUDE.md on the ship: the ticket prompt, acceptance, comment template, short-output rules, and how to report through MCP. Instructions reach the agent only as ticket comments."
acceptance = [
  "The generated file is pinned by a snapshot test",
  "An instruction comment is delivered to a running agent and marked delivered",
]
after = ["mcp"]

[[ticket]]
id = "review"
title = "Review modes: human, agent, both"
prompt = "Review on a ticket or chain: a person, a reviewer agent on its own runner, or the agent first and then a person who sees its remarks. Accept merges, Return sends the comment back."
acceptance = [
  "Each mode is covered by an integration test with sim reviewers",
  "The review mode resolves ticket -> chain -> project",
]
after = ["mcp"]

[[ticket]]
id = "automerge"
title = "Auto-merge into develop"
prompt = "On Accept, merge the ship branch into develop; a conflict blocks the ticket with merge_conflict and the details. Dependents start from the new develop."
acceptance = [
  "Accept merges and the ticket is Merged; a conflict makes it Blocked(merge_conflict)",
  "Tested against a temporary repository on three OSes",
]
after = ["review", "ships"]

[[ticket]]
id = "ui"
title = "Three-panel web UI with xterm.js"
prompt = "Grow apps/web into the three panels: chain graph, the runner terminal (xterm.js over the stream), ticket details with comments, subtasks and actions."
acceptance = [
  "Playwright test: open a ticket, see its live terminal, send an instruction, accept a review",
]
after = ["pty"]

[[ticket]]
id = "parallel"
title = "Parallel agent limit and queue"
prompt = "Per-project limit of running agents (default 2). A card started beyond the limit waits in a queue ordered by chain position; a finished or blocked run frees a slot and starts the next one."
acceptance = [
  "Unit tests with sim and fake agents cover the limit, queue order by chain position, and a freed slot starting the next card",
]
after = ["pty"]

[[ticket]]
id = "github"
title = "GitHub PR mode for merges"
prompt = "A project setting merge = local | github. In github mode Accept pushes the ship branch and opens a PR using the person's gh auth; it merges when checks are green. Failing checks block the card as ci_failed with the link."
acceptance = [
  "In github mode Accept pushes the branch, opens a PR and merges it when checks are green",
  "Failing checks make the ticket Blocked(ci_failed) with the PR link",
  "Local mode behaves as before",
]
after = ["automerge"]

[[ticket]]
id = "settings"
title = "Settings and onboarding in the window"
prompt = "Add a project from a folder (repo, base branch) and check that git, claude and gh are installed. Pick the default profile, the parallel limit, the review mode and the merge mode."
acceptance = [
  "Playwright test: add a project from a folder and see the git, claude and gh checks",
  "The default profile, parallel limit, review mode and merge mode can be set and are persisted",
]
after = ["ui"]

[[ticket]]
id = "inbox"
title = "Inbox in the window"
prompt = "Show wildcard approvals, agent questions (ask_human) with a reply box, and blocked cards with reasons. For leftovers of cards imported as done out of order offer three actions: move the open tasks into a new card at the end of the chain, close them, or leave them."
acceptance = [
  "Playwright test: answer an agent question and see it delivered",
  "Blocked cards are listed with their reasons",
  "Each of the three leftover actions works and is covered by a test",
]
after = ["ui", "mcp"]

[[ticket]]
id = "safety"
title = "Data safety: backups and log caps"
prompt = "Back up the database before every schema migration, keeping the last few. Cap and rotate runner logs."
acceptance = [
  "A migration test finds a fresh backup and old ones pruned to the configured count",
  "Runner logs are capped and rotated, covered by a test",
]

[[ticket]]
id = "claude-code"
title = "Claude Code profile end to end"
prompt = "The built-in claude-code profile: launch, CLAUDE.md, MCP and hooks wired, worker and reviewer roles. Run real tickets through it."
acceptance = [
  "A manual run on macOS where two cards with Claude Code agents run in parallel, go through review with a return round, and merge through GitHub PRs; recorded in the PR",
]
after = ["nudge", "claude-md", "automerge", "ui", "parallel", "github", "settings", "inbox", "safety"]

[[ticket]]
id = "package"
title = "Version and macOS package"
prompt = "Bump the version everywhere and build a .dmg in CI on a tag."
acceptance = [
  "All version fields agree, checked by a test or xtask guard",
  "Pushing a tag makes CI build and attach a .dmg",
]
after = ["claude-code"]

# The move-in release: v0.2.0 is simply the next version.
[[release]]
id = "v0.2.0"
channel = "tag_only"
start = "manual"
after = ["package"]
