[[ticket]]
id = "atomic-moves"
title = "A move on the diagram is one request"
prompt = "Moving a dependency edge is a POST then a DELETE with a compensating DELETE (apps/web/src/store/edgeEffects.ts around lines 35-50; the daemon has only POST and DELETE /chains/{chain}/edges, crates/app/src/chains.rs add_edge and remove_edge), and moving a design reference between cards on the board patches the target card then the source (apps/web/src/views/DesignBoard.tsx around lines 68-81, moveRef in apps/web/src/store/designBoard.ts), so a failure halfway leaves the reference on both cards. Build `POST /chains/{chain}/edges/move` with the old and the new edge, and `POST /tickets/{ticket}/designs/{index}/move` with the target card, each applied in one store transaction (the cycle check and dependency satisfaction for edges, the region kept for designs) and journaled as one event; the web uses them and drops the compensating code; the CLI dependency command learns a move. Covered by daemon route tests (success; a refused cycle and a missing target leave everything as it was), web unit tests, and the existing e2e specs for edges and the board updated to the new routes."
acceptance = [
  "An edge move and a design-reference move are each one request that either lands whole or changes nothing",
  "The web uses the move routes; the compensating code is gone",
]

[[ticket]]
id = "allow-always-says"
title = "Allow always says what it allows"
prompt = "A Bash command whose leading cd or export prefix is not plain (it contains $ or backticks) is not stripped, and `rule_for` in crates/core/src/model/command_policy.rs (around lines 146-170) yields Bash(cd *) or Bash(export *), which `rule_covers` never matches; `remember_command` returning None (crates/app/src/projects.rs around lines 246-260) ends as a 204 with no word to the person (crates/daemon/src/http/routes/questions.rs); the web offers Allow always on every Bash prompt (apps/web/src/store/commands.ts). Build: a non-plain prefix falls back to the exact command as the rule, or to no rule, never a prefix rule on cd or export; the permission question carries the rule that Allow always would add, or none with the reason (a command built with $ cannot become a rule); the web shows it under the button, for example Allow always: Bash(cargo test *), and hides the button when there is none; `tok` prints it with the question; after Allow always the answer says what was added. Trust mode allows every tool the deny list does not name (today only Bash, WebFetch and WebSearch are allowed, so other MCP tools still prompt), and the project settings page says what trust means. Covered by core tests of rule_for on the non-plain cases, a daemon test of the question payload, web unit tests and a cli output test."
acceptance = [
  "A permission question says which rule Allow always would add, or that none can be made and why; the button is hidden then",
  "No rule on cd or export is ever made; a non-plain prefix falls back to the exact command",
  "Trust mode allows every tool the deny list does not name",
]

[[ticket]]
id = "design-library-consistent"
