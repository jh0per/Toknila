after = ["inbox-carries-hand-in"]
prompt = "Deleting a design from the library (crates/daemon/src/http/routes/designs.rs, crates/daemon/src/designs/mod.rs remove) leaves the cards' references and the pins dangling, and the web says this design is no longer in the library. A pdf design has no node thumbnail (apps/web/src/views/NodeThumb.tsx). A pin without a card shows only on the mockup (crates/core/src/inbox/pins.rs), not in the inbox. Build: DELETE of a referenced design answers 409 naming the cards and pins that use it unless force is asked; forced, it removes the references and the open pins in the same transaction and a system comment on each card says which design went; the window asks (Used by TOKNILA-12, TOKNILA-14 and 2 pins. Remove anyway?) and then forces. A pdf design gets a thumbnail of its first page made the same way the library thumbnail is; the node and the board tile show it. A pin without a card is an inbox item of kind pin (The assistant asks about <design>) answered in place like the others, and the answer reaches show_plan. Covered by daemon tests (409, force, the pdf thumbnail), a core inbox test, web unit tests, and a new e2e spec in its own file that deletes a referenced design with force and sees the node lose its thumbnail cleanly."
