[[ticket]]
id = "merged-leaves-nothing"
title = "A merged card leaves nothing behind"
after = ["review-turn-phase"]
prompt = "After a local-mode merge the ship's worktree goes (`merged()` in crates/core/src/machine/review.rs queues RemoveShip) but the branch stays, and Settings, Leftover ships never lists it because crates/app/src/strays.rs counts every non-cancelled card as owning its branch. Build: in local merge mode the merged card's branch is deleted with the worktree (it is fully merged; a branch that by some race is not is kept and explained on the card like a cancelled card's); in pull-request mode the branch is left to the forge; the Leftover ships page lists branches of merged and cancelled cards alike, with the card's key and the merge commit, and deletes them; `tok ship prune` does the same from the CLI. Covered by daemon tests of the retire path for merged cards (deleted; kept with a comment), a strays test and a cli test."
acceptance = [
  "A card merged locally leaves no worktree and no branch; a kept branch is explained on the card",
  "Leftover ships lists and removes branches of merged cards; tok ship prune does the same",
]

[[ticket]]
id = "test-daemon-dies"
title = "A test daemon dies with its test"
prompt = "Test daemons leak when a test binary ends without unwinding (panic=abort, process::exit, a killed cargo): the guard in crates/cli/tests/common/mod.rs (Tok's Drop calls reap, DaemonGuard, a ctrlc handler) runs only on Drop or a signal; twenty orphans were found once, three more after TOKNILA-19, and two `tok watch` processes from a cli test lived four days. Build: the daemon learns to die with its parent through a flag `tok daemon run --exit-with-parent` (or an environment variable) given an inherited pipe (a handle on Windows) that the daemon reads: when the parent dies the pipe closes and the daemon stops its agents and exits within a second; the test helpers start every daemon and every `tok watch` that way; `cargo xtask verify` ends by listing `tok daemon run` processes whose home is under a temp directory and that are older than the run, and fails naming them, so a leak is seen at once. Covered by a cli test that kills the parent with SIGKILL and sees the daemon gone, and the xtask check."
acceptance = [
  "A daemon started by a test exits by itself when the test process dies, even with SIGKILL",
  "cargo xtask verify fails when a test daemon of this run is still alive",
]

[[ticket]]
