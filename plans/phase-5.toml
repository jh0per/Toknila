# Phase 5: the backlog. Everything the first six runs left behind (docs/runs/claude-code-e2e-4..6.md
# and the orchestrator's notes) that the code does not do yet, checked item by item against main at
# v0.2.11 on 2026-11-11. Each card names the files where the gap is today.
# The owner's words (2026-11-11): "та весь беклог роби".
# Import: in the window, Import on the TOKNILA project; or
#         tok chain import plans/phase-5.toml --project TOKNILA
#
# The order is the priority. `after` names the cards whose files a card shares; cards without a
# shared file run in parallel.

[chain]
name = "phase-5"
goal = "Every gap the runs found is closed: two cards never fight over a migration number, a hook of work never answers a question, nothing lands that was not handed in, the review turn and the inbox say what is really happening, an empty thread never blocks a hand-in, the design library stays consistent, moves are atomic, a release survives a restart, permissions say what they allow, the assistant reads only the repository and its designs, cards keep their size honest, a merged card leaves nothing behind, a test daemon dies with its test, an unknown field is refused, the instructions carry the lessons, and talking to the assistant never hangs"
autostart = false
version = "0.2.12"

[[ticket]]
id = "named-migrations"
title = "Migrations by name, never by number"
prompt = "The store's migrations are positional: crates/daemon/src/store/schema.rs holds MIGRATIONS with `// N:` comments and crates/daemon/src/store/mod.rs derives SCHEMA_VERSION from its length, so two cards that each add a table fight over the next number at every merge (TOKNILA-42, 46, 49 and 43 did in phase 4). Replace the position with a name. Every migration has a unique name (a short slug; the card key is a safe choice), lives in its own file under crates/daemon/src/store/migrations/ collected into one list without editing a shared line, and a `schema_migrations` table records the names that ran, with the time. On start the daemon runs, in list order and each in its own transaction, the migrations whose names are not recorded; the first start on an existing store seeds the table from the old SCHEMA_VERSION (the N migrations that already ran are recorded by name, nothing is run twice); a duplicate name is a startup error naming both files. SCHEMA_VERSION goes away or becomes a count used nowhere for ordering. AGENTS.md gets a short bullet, Adding a migration: a new file, a unique name, never edit a released one. Covered by store tests: a fresh store runs them all; a fixture store at an old version is seeded and only the new ones run; a duplicate name fails; the order follows the list."
acceptance = [
  "A new migration is a new file with a unique name; two cards that each add one merge without a conflict and both run",
  "An existing data home upgrades once: the migrations it already ran are recorded by name and never run again",
  "AGENTS.md says how to add a migration; covered by store tests for the fresh, upgraded and duplicate cases",
]

[[ticket]]
id = "hook-never-answers"
title = "A hook of work never answers a question"
prompt = "Hooks of work move a Waiting card back to Running when nothing was answered. Today `ticket_activity` in crates/daemon/src/http/routes/events.rs (about lines 95-185) decides, `nudge::resumes` in crates/core/src/nudge/mod.rs names the resuming hooks (post_tool_use, user_prompt_submit), `activity` in crates/app/src/agent.rs (about lines 226-240) skips the resume only for Waiting(Question) so a Waiting(Permission) card resumes on any hook, and the MCP events Started, SubtaskDone, Note and Finished (crates/app/src/agent.rs about lines 49-55) resume without looking. The rule to build: an open question is closed only by its answer; an open permission prompt is closed only by its answer in the window or by the post_tool_use hook of the very tool call that was prompted (a prompt answered at the terminal yields only that hook; `clears_prompt` in crates/core/src/hook.rs already matches it); every other hook or MCP event leaves a card waiting on a question or a permission where it is, though its activity still feeds the nudge signals. A `finished` while a question is open closes the question as overtaken by the hand-in, with a system comment, and goes on. Move the decision out of the route into core (a pure function, say `hook::react`, from status, waiting reason, signal and open prompt to a decision) and app (`agent::activity` applies it); the route becomes thin. Covered by a core table test (every signal against every waiting reason), an app test that a terminal-answered permission resumes while an unrelated post_tool_use does not, and a cli test with the fake agent for the MCP events."
acceptance = [
  "A card waiting on a question or a permission stays waiting through hooks of work and MCP events; only its answer, or for a permission the hook of the prompted call, resumes it",
  "A hand-in with an open question closes the question as overtaken and goes on",
  "The decision is one pure core function with a table test; the route only applies it",
]

[[ticket]]
id = "handed-in-only"
title = "Nothing lands that was not handed in"
prompt = "Accept takes whatever the ship's HEAD is. `review.handed_in` (recorded in crates/app/src/agent.rs at the hand-in) is compared with HEAD only for a `finished` after a Return (crates/core/src/guard.rs). Build two things. First, Accept (crates/daemon/src/http/routes/tickets.rs around lines 171-196, where `guard_ship` already returns the seen head) refuses when the ship's HEAD carries commits that are neither the hand-in commit nor the daemon's own base-sync merge commits (the sync must record what it made), with a message naming the extra commits and the two ways out: return the card so the agent hands in again, or wait for a new hand-in; `tok accept` prints it and the Review card shows it. Second, a hand-in after a Return gets a Since the Return block: the daemon derives it from the returned HEAD to the new one (commit subjects and changed files, capped) and keeps it with the hand-in; the Review card (apps/web/src/views/HandIn.tsx) and `tok show` print it under the hand-in blocks, and the reviewer's kickoff names it so the reviewer reads what changed since the Return first. Covered by daemon tests (an extra commit refused, a sync merge accepted, the content of the block), a cli test and a web unit test of the block."
acceptance = [
  "Accept refuses a ship whose HEAD carries commits beyond the hand-in, naming them; the daemon's own base-sync merge is not an extra commit",
  "A hand-in after a Return carries a Since the Return block in the Review card, in tok show and in the reviewer's kickoff",
  "Covered by daemon, cli and web tests",
]

[[ticket]]
id = "review-turn-phase"
title = "The review turn says what it is doing"
prompt = "During the Check turn the window says In review: bringing the ship up to main for the whole turn (apps/web/src/store/cardStatus.ts around lines 69-76), also while the check command runs for minutes; the daemon exposes only `awaiting = Check` and `check_queue` (crates/core/src/model/review.rs, crates/app/src/reviews.rs). A project with no check command still gets the fixed comment The check passed (crates/core/src/machine/review.rs around lines 84-89) so the round list reads Round 1: the check passed, The check passed (apps/web/src/store/review.ts). The lost-check comment The check could not run is recorded as the agent's (crates/app/src/chain.rs maps every RecordReport to Actor::Agent) and prints by agent. Build: the review state carries a check phase (queued n-th, syncing with main, running the check command with its start time) that the checker updates; cardStatus, the CLI status column (crates/cli/src/output.rs) and the Review card show it, for example Being checked: cargo xtask verify, 3 min; with no check command the round's comment and the round list read brought up to main; the project has no check command; the daemon's own comments (lost check, check output) have the system author, shown as Toknila in the window and by Toknila in tok show. Covered by core tests of the phase transitions, a web unit test of the texts and a cli output test."
acceptance = [
  "The window and tok ls say whether a card in the Check turn is queued, syncing with main or running the check command, with its name and elapsed time",
  "A project without a check command gets a round that says so, not 'the check passed'",
  "The daemon's own comments read as Toknila, never as the agent",
]

[[ticket]]
id = "empty-thread"
title = "An empty thread never blocks a hand-in"
prompt = "In run 6 the agent of TOKNILA-48 opened a second design thread by mistake; `finished` is refused while any Open thread exists (crates/app/src/agent.rs around lines 131-142 through `require_none_open` in crates/core/src/thread.rs), Approve is person-only, so the agent had to ask a person to approve an empty duplicate. Build four things. (1) `open_thread` of a kind the card already has an open or approved thread of (crates/app/src/planner/mod.rs around lines 153-163, crates/app/src/threads.rs, crates/core/src/thread.rs) answers 409 with a hint that names thread N and says to post a version on it, for the planner and the card agent alike; the MCP tool text says the same. (2) An agent may withdraw its own thread while it has no version and no person message: a new thread state Withdrawn in crates/core/src/model/thread.rs, a tool and route withdraw_thread, journaled. (3) The finished guard ignores threads with no version: a thread without a version is not a design. (4) The window shows a thread with no version as a draft (muted, no version yet) in the thread list and never counts it as waiting for approval. Covered by core tests of the withdraw rules and the guard, daemon tests of the hint and the route through the fake agent, and a web unit test of the draft look."
acceptance = [
  "A second open_thread of the same kind on a card answers with a hint to post a version on the existing thread",
  "An agent withdraws its own empty thread; an empty thread never blocks finished",
  "The window shows an empty thread as a draft",
]

[[ticket]]
id = "inbox-carries-hand-in"
title = "The inbox row carries the hand-in"
after = ["handed-in-only"]
prompt = "The review row of the inbox shows the hand-in blocks only when the card's details were loaded somewhere else: apps/web/src/views/InboxRow.tsx reads state.details, and InboxItem in crates/core/src/inbox/mod.rs has no gist, what or checks. Build: the inbox item of a review carries the hand-in summary (gist, what changed, the checks with their PASS, FAIL and NOT_RUN lines, what is left, and the Since the Return block when there is one) so the row shows it without another request; a question item carries its text and a pin item the design name the same way; `tok inbox` prints the gist and the checks line of a review item. Covered by a core test of the item, a web unit test of the row fed the item alone, and a cli output test."
