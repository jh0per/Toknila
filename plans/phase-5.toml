[[ticket]]
id = "assistant-reads-only"
title = "The assistant reads the repository and its designs, nothing else"
after = ["allow-always-says"]
prompt = "The planner profile has a plain Read allow rule (crates/core/src/model/profile.rs), so may read the design files and nothing else outside the repository rests on the deny list alone (TOKNILA-41's hand-in said so); the worker profile may be the same. Build: the planner's and the worker's Read, Grep and Glob (where the rules allow them) are scoped to the repository (the ship or the project root) plus the explicit design files, as rooted allow rules in the form toknila_core::private::read_allow_rule makes, and nothing else; the deny list stays as the second wall. A wiring test shows that with the deny list emptied a Read outside those roots is still not allowed by the allow rules; the live probe of TOKNILA-27 is repeated as a cli test with the fake agent reading inside and outside. The reviewer profile is checked the same way and narrowed if it is plain. Covered by wiring tests per profile."
