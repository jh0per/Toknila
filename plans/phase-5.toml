[[ticket]]
id = "instructions-lessons"
title = "The instructions carry the lessons of runs 5 and 6"
after = ["named-migrations", "empty-thread", "assistant-reads-only"]
prompt = "Runs 5 and 6 left six rules that the texts in crates/core/src/instructions/ (protocol.rs, the kickoff in mod.rs) and AGENTS.md do not carry yet. (1) Before proposing a fix or a wildcard card for a failing test, run it alone once; a test that passes alone is a load problem to report in the hand-in, not to fix. (2) Share the machine says a few workers under nice: make it one build or test loop under nice, never more, stopped by a trap. (3) When the check failure is about the environment (command not found, exit 127, a tool refused), say so in the hand-in and stop: do not fix the environment, do not add an empty commit. (4) Before the hand-in, merge the project's work branch into the ship and resolve the conflicts, keeping every existing entry of a shared list. (5) A Checks line quotes the gate's own result line word for word, and the daemon refuses a PASS whose evidence is under 20 characters. (6) The kickoff's Checks section points at AGENTS.md's Adding a migration bullet. Also protocol.rs says shell edits stop for a permission answer every time while AGENTS.md says they are refused; the daemon refuses them, so both say refused. Update the snapshot tests one at a time; keep the texts short, an agent reads them at every start."
acceptance = [
  "The six rules are in the protocol, the kickoff or AGENTS.md, each where an agent meets the situation",
  "A PASS line whose evidence is under 20 characters is refused by the daemon with the rule named",
  "protocol.rs and AGENTS.md agree that shell edits are refused",
]
