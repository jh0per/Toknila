[[ticket]]
id = "release-persists"
title = "A release survives a restart"
after = ["named-migrations"]
prompt = "The release run's steps (check, bump, tag, push) live in a process-global in-memory map (crates/daemon/src/releaser.rs) and are lost on a daemon restart; only the milestone's state and tag are saved (crates/app/src/releases.rs). There is no browser e2e of the Release dialog (apps/web/src/views/ReleaseDialog.tsx with the test ids release-dialog and release-version; apps/web/e2e/epic.mjs checks only the Finish text). Build: every step is a journaled event (started, passed or failed with the output tail) read back from the store, so the dialog and the CLI show the steps after a restart; a daemon that restarts in the middle of a release marks the run interrupted at the step it was in, and the Finish node offers to run it again from that step (a step that completed, like the tag, is not redone); a chain released once offers Release again when a new card merges after the release, with the next version suggested from the newest tag, and a core test covers it. A new e2e spec release.mjs in its own file opens the Release dialog on a finished chain in a temp repository with a check command, runs the release and sees the Finish node read released with the tag; its screenshot goes to docs/runs. Covered by daemon tests of the persistence and of the interrupted run, the e2e and the core test."
acceptance = [
  "The release steps are in the journal and shown after a daemon restart; an interrupted release can be run again from its step",
  "A chain released once can be released again after a new merged card, with the next version suggested",
  "A browser e2e runs a release through the dialog",
]

[[ticket]]
id = "cards-size-honest"
title = "Cards keep their size honest"
