prompt = "PATCH /projects/{project} with an unknown field answers 200 and changes nothing (PatchProject in crates/app/src/projects.rs has no deny_unknown_fields; NewProject is the same), which cost the orchestrator two silent misses on the review mode field. Build: every request body the daemon deserialises (project new and patch, ticket patch, chain patch, thread and discussion bodies, settings) rejects an unknown field with 400 naming the field and listing the accepted ones, and a wrong enum value does the same; `tok` prints the daemon's message; the openapi document is regenerated and a test asserts every body schema has additionalProperties false. Covered by a daemon test per body kind (one unknown field gives 400 with its name) and the openapi test."
acceptance = [
  "Any request body with an unknown field answers 400 naming it and the accepted fields",
  "The openapi document says additionalProperties false for every body; tok prints the daemon's message",
]

[[ticket]]
id = "discussion-never-hangs"
