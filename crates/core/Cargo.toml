[package]
name = "toknila-core"
description = "Toknila domain model and pure rules: chains, tickets, state machine. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Guarded by `cargo xtask verify`: core must stay free of async runtimes and storage
# (no tokio, rusqlite, sqlx, axum). Keep it pure so every rule is unit-testable.
[dependencies]
serde.workspace = true
thiserror.workspace = true
ulid.workspace = true
utoipa = { workspace = true, optional = true }

[features]
# Derives OpenAPI schemas for the daemon's API description.
openapi = ["dep:utoipa"]

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
